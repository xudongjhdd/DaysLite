<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DaysLite</title>
  <meta name="description" content="DaysLite is a lightweight Android countdown app for important dates.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f3;
      --ink: #17211a;
      --muted: #59665d;
      --line: #dbe2d7;
      --panel: #ffffff;
      --accent: #2f6f4f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>DaysLite</h1>
    <p>A lightweight Android countdown app for important dates. No account, no ads, and countdown data stays on your device.</p>
    <a href="./privacy-policy.html">Privacy Policy</a>
  </main>
</body>
</html>
